global:
  scrape_interval: 15s
  evaluation_interval: 15s     # default 1m makes the 5m "for:" timing sloppy

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: jenkins
    metrics_path: /prometheus/          # trailing slash: /prometheus redirects
    static_configs:
      - targets: ['jenkins:8080']       # container name on jenkins-net

  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']
