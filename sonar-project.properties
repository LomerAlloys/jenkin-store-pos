# SonarQube Project Configuration
sonar.projectKey=taskflow-api
sonar.projectName=taskflow-api
sonar.projectVersion=1.0

# ===== IMPORTANT: กำหนด sources เฉพาะโค้ดใน server/src เท่านั้น =====
# ห้าม scan ทั้ง repo เพราะมีไฟล์ PDF ชื่อภาษาไทยใน docs/ ซึ่งทำให้
# sonar-scanner JVM เกิด InvalidPathException (Malformed input)
sonar.sources=server/src

# Test directories
sonar.tests=server/src
sonar.test.inclusions=**/*.spec.ts,**/*.test.ts

# Coverage report (generated by vitest --coverage)
sonar.javascript.lcov.reportPaths=server/coverage/lcov.info

# ===== Exclusions =====
# docs/ — มีไฟล์ PDF ชื่อภาษาไทย ทำให้ JVM เกิด InvalidPathException
# e2e/ — Playwright test code ไม่ต้อง analyze
# dist/ — build output
# node_modules/ — dependencies
sonar.exclusions=docs/**,e2e/**,**/dist/**,**/node_modules/**,**/*.pdf,**/*.md,**/coverage/**,**/*.json,android/**,ios/**,frontend/**,deploy/**

# Language settings
sonar.sourceEncoding=UTF-8
